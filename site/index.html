<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nghĩa Sơn – Ứng dụng</title>
<meta name="description" content="Hệ sinh thái ứng dụng nội bộ của Công ty Nghĩa Sơn: PDF Editor, Load Planner và các công cụ khác.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nghĩa Sơn – Ứng dụng">
<meta property="og:title" content="Công ty NGHĨA SƠN – Ứng dụng">
<meta property="og:description" content="PDF Editor, Load Planner và các công cụ của Nghĩa Sơn trong một trang.">
<meta property="og:image" content="https://dxh3001.pages.dev/logo.jpg">
<meta name="theme-color" content="#F0F6F2">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#75BA6A; --red:#940000; --cream:#F0F6F2; --ink:#2B2B2B; --white:#fff;
  --muted:#5f6b63; --line:#d6e6da;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
header{display:flex;flex-direction:column;align-items:center;padding:28px 16px 8px;text-align:center}
.logo{width:190px;height:auto;display:block}
h1{font-family:"Playfair Display",Georgia,serif;color:var(--red);font-size:clamp(28px,4.5vw,44px);margin:6px 0 4px;letter-spacing:.5px}
.sub{color:var(--muted);margin:0;font-size:15px}
.rule{width:72px;height:3px;background:var(--green);border-radius:2px;margin:16px auto 0}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:28px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.app{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px 18px;text-decoration:none;min-height:200px;transition:transform .15s,border-color .15s,box-shadow .15s}
a.app:hover,a.app:focus-visible{transform:translateY(-3px);border-color:var(--green);box-shadow:0 10px 24px rgba(43,43,43,.08);outline:none}
.ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff}
.ico svg{width:28px;height:28px}
.app h2{font-family:"Playfair Display",Georgia,serif;font-size:21px;margin:4px 0 0;color:var(--red)}
.app p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;flex:1}
.go{font-size:13.5px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:6px}
a.app:hover .go{gap:10px}
.soon{border-style:dashed;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.soon .ico{background:transparent;border:1.5px dashed var(--line);color:var(--green)}
.soon h2{color:var(--muted);font-size:18px}
.tag{position:absolute;top:18px;right:16px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 16px 26px;border-top:1px solid var(--line)}
@media (max-width:520px){.logo{width:150px}.grid{grid-template-columns:1fr}.app{min-height:0}}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.jpg" alt="Nghĩa Sơn Furniture – Since 2006" width="2560" height="1707">
  <h1>Công ty NGHĨA SƠN</h1>
  <p class="sub">Các ứng dụng làm việc – mở trực tiếp trên trình duyệt, không cần cài đặt</p>
  <div class="rule"></div>
</header>

<main>
  <div class="grid" id="apps"></div>
</main>

<footer>© <span id="yr"></span> Nghĩa Sơn Furniture · by DxH</footer>

<script>
/* ===== Danh sách ứng dụng =====
   Thêm ứng dụng mới: thêm 1 dòng vào APPS (url = thư mục con, kết thúc bằng "/").
   Ô có soon:true hiển thị dạng "Sắp ra mắt" (không bấm được). */
const ICONS = {
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  pack: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="m8.5 13 2.5 2.5 4.5-5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const APPS = [
  { name: 'PDF Editor',   url: 'pdf-editor/',   icon: 'pdf', color: '#940000',
    desc: 'Sửa chữ, ảnh, bảng trong PDF; ghép/tách trang, OCR bản scan, ký tên, so sánh 2 file.' },
  { name: 'Load Planner', url: 'load-planner/', icon: 'box', color: '#75BA6A',
    desc: 'Lập phương án xếp hàng vào container 3D, xếp tay, xuất báo cáo PDF / Excel.' },
  /* external: chạy trên máy chủ công ty (qua Tailscale Funnel), mở tab mới, cần tài khoản đăng nhập */
  { name: 'Quản lý AI & Packing', url: 'https://desktop-89se9ff.tail325211.ts.net/', icon: 'pack', color: '#4f8f45', external: true,
    desc: 'Hướng dẫn lắp ráp (AI), đóng gói (Packing), Test Report cho từng sản phẩm; ảnh SP, tìm bằng hình ảnh.' },
  { name: 'Ứng dụng mới', soon: true, desc: 'Sắp ra mắt' },
];
const arrow = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
document.getElementById('apps').innerHTML = APPS.map(a => a.soon
  ? `<div class="app soon" aria-disabled="true"><span class="ico">${ICONS.plus}</span><h2>${a.name}</h2><p>${a.desc}</p></div>`
  : `<a class="app" href="${a.url}"${a.external ? ' target="_blank" rel="noopener"' : ''}><span class="ico" style="background:${a.color}">${ICONS[a.icon]}</span>${a.external ? '<span class="tag">🔒 Cần tài khoản</span>' : ''}<h2>${a.name}</h2><p>${a.desc}</p><span class="go">Mở ứng dụng ${arrow}</span></a>`
).join('');
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
